<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="StickerBridge preview banner">
  <defs>
    <radialGradient id="sbp-glow" cx="28%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#3DDC84" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#3DDC84" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#3DDC84" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sbp-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22E4FF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#FF3D9A" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#25D366" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="sbp-btn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3DDC84"/>
      <stop offset="100%" stop-color="#25D366"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#0B100D"/>
  <rect width="1200" height="630" fill="url(#sbp-glow)"/>

  <!-- App icon tile -->
  <g>
    <rect x="90" y="96" width="144" height="144" rx="34" fill="#161622" stroke="url(#sbp-ring)" stroke-width="2"/>
    <path d="M122 132 h44 c3.5 0 6.4 2.9 6.4 6.4 v27.6 l-15 15 h-31.6 c-3.5 0 -6.4 -2.9 -6.4 -6.4 v-36.2 c0 -3.5 2.9 -6.4 6.6 -6.4 z" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>
    <path d="M146 143.5 c2.4 0 4.3 -0.9 5.6 -2.5 v13.4 c0 3.7 -3 6.7 -6.7 6.7 c-3.7 0 -6.7 -3 -6.7 -6.7 c0 -3.7 3 -6.7 6.7 -6.7 c1 0 1.9 0.3 2.7 0.7 v-5.1 z" fill="#FFFFFF"/>
    <circle cx="168" cy="128" r="11" fill="#25D366" stroke="#0B100D" stroke-width="3"/>
    <path d="M163 128.2 l3.4 3.4 l6.8 -6.8" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Title block -->
  <text x="90" y="352" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="82" font-weight="800" letter-spacing="-2" fill="#E8F0EA">StickerBridge</text>
  <text x="92" y="404" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="500" fill="#9DB3A4">TikTok <tspan fill="#3DDC84">→</tspan> WhatsApp sticker packs.</text>

  <!-- Capability pills -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="19" font-weight="700">
    <rect x="90" y="436" width="252" height="48" rx="24" fill="rgba(61,220,132,0.12)" stroke="#3DDC84" stroke-opacity="0.5"/>
    <text x="114" y="467" fill="#3DDC84">⚡ 1-TAP AUTO-SCAN</text>
    <rect x="356" y="436" width="252" height="48" rx="24" fill="none" stroke="#31473A"/>
    <text x="380" y="467" fill="#9DB3A4">ANIMATED WEBP</text>
    <rect x="622" y="436" width="150" height="48" rx="24" fill="none" stroke="#31473A"/>
    <text x="646" y="467" fill="#9DB3A4">ANDROID</text>
  </g>
  <text x="92" y="536" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="21" letter-spacing="3" fill="#64766B">NATIVE · FREE · DIRECT APK</text>

  <!-- Floating chips -->
  <g transform="rotate(-12 812 150)">
    <rect x="780" y="118" width="64" height="64" rx="18" fill="#131B15" stroke="#31473A" stroke-width="2"/>
    <text x="812" y="161" text-anchor="middle" font-size="32">⚡</text>
  </g>
  <g transform="rotate(10 812 470)">
    <rect x="780" y="438" width="64" height="64" rx="18" fill="#131B15" stroke="#31473A" stroke-width="2"/>
    <text x="812" y="481" text-anchor="middle" font-size="30" fill="#3DDC84">✦</text>
  </g>

  <!-- Phone mockup -->
  <g>
    <rect x="884" y="60" width="252" height="510" rx="54" fill="#050807" stroke="#31473A" stroke-width="3"/>
    <rect x="898" y="74" width="224" height="482" rx="42" fill="#101713"/>
    <text x="1010" y="116" text-anchor="middle" font-family="Inter, sans-serif" font-size="21" font-weight="800" fill="#E8F0EA">TT <tspan fill="#3DDC84">→</tspan> WA</text>
    <rect x="918" y="134" width="184" height="52" rx="26" fill="#131B15" stroke="#31473A" stroke-width="2"/>
    <text x="1010" y="166" text-anchor="middle" font-family="Inter, sans-serif" font-size="17" font-weight="700" fill="#9DB3A4">paste TikTok link…</text>
    <rect x="918" y="198" width="184" height="56" rx="28" fill="url(#sbp-btn)"/>
    <text x="1010" y="233" text-anchor="middle" font-family="Inter, sans-serif" font-size="19" font-weight="800" fill="#0B100D">⚡ 1-Tap Scan</text>
    <g>
      <rect x="918" y="270" width="184" height="104" rx="20" fill="#131B15" stroke="#31473A" stroke-width="2"/>
      <rect x="930" y="286" width="44" height="44" rx="12" fill="#25D366" opacity="0.25"/>
      <text x="952" y="316" text-anchor="middle" font-size="24">🙂</text>
      <rect x="984" y="290" width="70" height="12" rx="6" fill="#31473A"/>
      <rect x="984" y="310" width="46" height="10" rx="5" fill="#223028"/>
      <rect x="930" y="340" width="52" height="22" rx="11" fill="url(#sbp-btn)"/>
      <text x="956" y="356" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#0B100D">+ Add</text>
    </g>
    <g>
      <rect x="918" y="386" width="184" height="104" rx="20" fill="#131B15" stroke="#31473A" stroke-width="2"/>
      <rect x="930" y="402" width="44" height="44" rx="12" fill="#22E4FF" opacity="0.2"/>
      <text x="952" y="432" text-anchor="middle" font-size="24">🎉</text>
      <rect x="984" y="406" width="70" height="12" rx="6" fill="#31473A"/>
      <rect x="984" y="426" width="46" height="10" rx="5" fill="#223028"/>
      <rect x="930" y="456" width="52" height="22" rx="11" fill="url(#sbp-btn)"/>
      <text x="956" y="472" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#0B100D">+ Add</text>
    </g>
  </g>
</svg>
