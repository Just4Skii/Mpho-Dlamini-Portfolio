name: Build & Publish GraffGrid Platform (branch deployment)

# Publishing model: GitHub Pages source is "Deploy from branch: main" (serves the repo
# root), so this workflow builds the whole platform, copies the assembled dist/ CONTENT
# into the repository root (source folders are untouched), commits and pushes. The push
# triggers GitHub's own "pages build and deployment" job, which publishes the root tree.
#
# Every other project app (apex/kasicart/carepoint/stickerbridge/klarrow) is built into
# work/<app>/ by scripts/assemble-dist.js together with the master 404.html deep-link
# handler, CNAME and .nojekyll (disables Jekyll processing for branch publishing).
#
# Loop protection: publish commits only change the paths below (ignored by this trigger),
# so this workflow does not re-trigger itself. Any source change re-triggers a full build.

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "assets/**"
      - "work/**"
      - "index.html"
      - "404.html"
      - "CNAME"
      - "favicon.svg"
      - ".nojekyll"
      - "klarrow-k-*"
      - "klarrow-preview.*"
      - "stickerbridge-preview.*"
      - "skii-os-preview.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages-branch-publish"
  cancel-in-progress: true

jobs:
  build-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build platform
        run: npm run build

      - name: Publish built site into main (Pages branch model serves the repo root)
        run: |
          set -e
          touch dist/.nojekyll
          rm -f index.html CNAME 404.html favicon.svg
          cp -r dist/. .
          git config user.name "graffgrid-publisher"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Stage the full working-tree delta: CI checked out a clean tree, so the only
          # local changes are the copied dist content (root files + assets/ + work/).
          # Enumerating paths previously MISSED non-enumerated portfolio public assets
          # (e.g. klarrow-preview.svg, stickerbridge-preview.svg) -> broken card images.
          git add -A
          if git diff --cached --quiet; then
            echo "No published-file changes"
            exit 0
          fi
          git commit -m "chore(publish): refresh site artifacts from source"
          git push origin main
