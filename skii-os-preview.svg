    <path d="M-52 96c-14 4-20 22-16 42 4 18 16 30 12 44-4 16-22 24-24 44" fill="none" stroke="url(#rim)" stroke-width="2.4" stroke-opacity="0.85"/>
    <path d="M58 100c16 6 22 26 16 46-4 16-16 28-12 42" fill="none" stroke="url(#rim)" stroke-width="2" stroke-opacity="0.6"/>
