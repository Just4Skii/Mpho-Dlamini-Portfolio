<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Skii OS preview">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0a08"/>
      <stop offset="0.45" stop-color="#48200c"/>
      <stop offset="0.72" stop-color="#8c3a10"/>
      <stop offset="1" stop-color="#140705"/>
    </linearGradient>
    <radialGradient id="fire" cx="0.5" cy="0.62" r="0.62">
      <stop offset="0" stop-color="#ff7a2a" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#c8410d" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#c8410d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="titan" cx="0.5" cy="0.3" r="0.5">
      <stop offset="0" stop-color="#2a1109"/>
      <stop offset="1" stop-color="#0a0403"/>
