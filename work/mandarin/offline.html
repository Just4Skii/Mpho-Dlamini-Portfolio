<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HSK 1 Tutor – Offline</title>
  <style>
    body { font-family: 'Inter', sans-serif; background: #f5ede0; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; text-align: center; padding: 20px; }
    .box { background: #fff; border-radius: 16px; padding: 40px 32px; max-width: 360px; box-shadow: 0 4px 24px rgba(0,0,0,0.1); }
    .icon { font-size: 64px; margin-bottom: 16px; }
    h1 { color: #c0392b; font-size: 22px; margin-bottom: 12px; }
    p { color: #666; font-size: 14px; line-height: 1.6; margin-bottom: 20px; }
    button { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 12px 24px; font-size: 15px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">📚</div>
    <h1>You're Offline</h1>
    <p>No internet connection detected. Please check your Wi-Fi or mobile data, then try again.</p>
    <button onclick="window.location.reload()">🔄 Try Again</button>
  </div>
</body>
</html>
