<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>GraffGrid Platform</title>
  <script type="text/javascript">
    (function() {
      var l = window.location;
      var path = l.pathname;
      
      // Match repo prefix if any (e.g. /Mpho-Dlamini-Portfolio)
      var repoPrefix = '';
      var prefixMatch = path.match(/^(\/[^\/]+)(\/work.*)?/i);
      if (prefixMatch && prefixMatch[1] && !prefixMatch[1].startsWith('/work')) {
        repoPrefix = prefixMatch[1];
        path = path.slice(repoPrefix.length);
      }
      
      if (path.indexOf('/work/apex') === 0) {
        var base = repoPrefix + '/work/apex';
        var rest = path.slice('/work/apex'.length);
        if (rest === '' || rest === '/') {
          l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + base + '/');
        } else {
          l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + base + '/?/' + rest.slice(1).replace(/&/g, '~and~') + (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') + l.hash);
        }
      } else if (path.indexOf('/work/kasicart') === 0) {
        var base = repoPrefix + '/work/kasicart';
        var rest = path.slice('/work/kasicart'.length);
        if (rest === '' || rest === '/') {
          l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + base + '/');
        } else {
          l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + base + '/?/' + rest.slice(1).replace(/&/g, '~and~') + (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') + l.hash);
        }
      } else if (path.indexOf('/work/carepoint') === 0) {
        var base = repoPrefix + '/work/carepoint';
        var rest = path.slice('/work/carepoint'.length);
        if (rest === '' || rest === '/') {
          l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + base + '/');
        } else {
          l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + base + '/?/' + rest.slice(1).replace(/&/g, '~and~') + (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') + l.hash);
        }
      } else if (path.indexOf('/work/stickerbridge') === 0) {
        var base = repoPrefix + '/work/stickerbridge';
        var rest = path.slice('/work/stickerbridge'.length);
        if (rest === '' || rest === '/') {
          l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + base + '/');
        } else {
          l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + base + '/?/' + rest.slice(1).replace(/&/g, '~and~') + (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') + l.hash);
        }
      } else if (path.indexOf('/work/klarrow') === 0) {
        var base = repoPrefix + '/work/klarrow';
        var rest = path.slice('/work/klarrow'.length);
        if (rest === '' || rest === '/') {
          l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + base + '/');
        } else {
          l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + base + '/?/' + rest.slice(1).replace(/&/g, '~and~') + (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') + l.hash);
        }
      } else if (path.indexOf('/work/skii-os') === 0) {
        var base = repoPrefix + '/work/skii-os';
        var rest = path.slice('/work/skii-os'.length);
        if (rest === '' || rest === '/') {
          l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + base + '/');
        } else {
          l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + base + '/?/' + rest.slice(1).replace(/&/g, '~and~') + (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') + l.hash);
        }
      } else if (/^/work/(atelier|reechme|poc-trust|popia|westown|mandarin|heraldobserver|fixed-funding|ski-shuffle|poc-trust-case|popia-case)(/|$)/.test(path)) {
        var slug = path.split('/')[2];
        l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + repoPrefix + '/work/' + slug + '/');
      } else {
        var base = repoPrefix;
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + base + '/?/' +
          path.slice(1).replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      }
    })();
  </script>
</head>
<body>
</body>
</html>
